<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Following Data</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f0f0f0; }
    header { padding: 1rem; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .filter-container { display: flex; justify-content: center; gap: 1rem; }
    .card-container { display: flex; flex-wrap: wrap; gap: 1rem; justify-content: center; padding: 1rem; }
    .card {
      background: #fff; border-radius: 6px; box-shadow: 0 2px 5px rgba(0, 0, 0, 0.15);
      width: 250px; display: flex; flex-direction: column; align-items: center; padding: 1rem;
    }
    .card a.title-link { text-decoration: none; color: #333; }
    .card h2 { margin: 0.5rem 0; font-size: 1.1rem; text-align: center; }
    .card img { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; }
    .icon-container { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; margin-top: 1rem; }
    .icon-container a svg { fill: #333; width: 32px; height: 32px; }
    .icon-container a { display: inline-block; }
  </style>
</head>
<body>
  <header>
    <div class="filter-container">
      <label for="filterSelect">Filter / Sort:</label>
      <select id="filterSelect" onchange="updateFilter()">
        <option value="all">All</option>
        <option value="social">Has Social</option>
        <option value="alphabetical">Alphabetical</option>
        <option value="alphabeticalSocial">Alphabetical + Has Social</option>
      </select>
    </div>
  </header>

    const ICON_MAP = [
      { key: "bsky.app", icon: bluesky },
      { key: "discord", icon: discord },
      { key: "facebook", icon: facebook },
      { key: "github", icon: github },
      { key: "instagram", icon: instagram },
      { key: "linkedin", icon: linkedin },
      { key: "mastodon", icon: mastadon },
      { key: "medium", icon: medium },
      { key: "onlyfans", icon: onlyfans },
      { key: "patreon", icon: patreon },
      { key: "pinterest", icon: pinterest },
      { key: "reddit", icon: reddit },
      { key: "snapchat", icon: snapchat },
      { key: "soundcloud", icon: soundcloud },
      { key: "t.me", icon: telegram },
      { key: "threads.net", icon: threads },
      { key: "tiktok.com", icon: tiktok },
      { key: "tumblr", icon: tumblr },
      { key: "twitch.tv", icon: twitch },
      { key: "vimeo", icon: vimeo },
      { key: "whatsapp", icon: whatsapp },
      { key: "x.com", icon: xtwitter },
      { key: "twitter.com", icon: xtwitter },
      { key: "youtube", icon: youtube }
    ];

    function getIcon(url) {
      for (const { key, icon } of ICON_MAP) {
        if (url.includes(key)) return icon;
      }
      return null;
    }

    // We'll store all profiles in a global variable to re-filter as needed
    let allProfiles = [];

    fetch('following_data.json')
      .then(res => res.json())
      .then(data => {
        allProfiles = data;
        renderCards(allProfiles);
      })
      .catch(err => console.error(err));

    // Returns a new array of profiles based on the filter/sort selection
    function filterAndSortData(profiles, filterType) {
      let filtered = [...profiles];

      // Filter
      if (filterType === 'social' || filterType === 'alphabeticalSocial') {
        filtered = filtered.filter(p => {
          const hasSocial = (p.social_links && p.social_links.length > 0) || p.linktree_url;
          return hasSocial;
        });
      }

      // Sort
      if (filterType === 'alphabetical' || filterType === 'alphabeticalSocial') {
        filtered.sort((a, b) => {
          const handleA = (a.tiktok_profile.split('@')[1] || '').toLowerCase();
          const handleB = (b.tiktok_profile.split('@')[1] || '').toLowerCase();
          return handleA.localeCompare(handleB);
        });
      }
      return filtered;
    }

    function renderCards(profiles) {
      const cardsContainer = document.getElementById('cards');
      cardsContainer.innerHTML = '';

      profiles.forEach(profile => {
        // Remove duplicates from social_links
        const uniqueLinks = Array.from(new Set(profile.social_links || []));

        // Extract handle from TikTok URL
        const handle = profile.tiktok_profile.split('@')[1] || '';

        const card = document.createElement('div');
        card.className = 'card';

        // Make handle clickable
        const titleLink = document.createElement('a');
        titleLink.href = profile.tiktok_profile;
        titleLink.target = '_blank';
        titleLink.rel = 'noopener noreferrer';
        titleLink.classList.add('title-link');
        titleLink.innerHTML = `<h2>@${handle}</h2>`;

        const img = document.createElement('img');
        img.src = profile.profile_image_url || 'https://via.placeholder.com/100';
        img.alt = handle;

        const iconContainer = document.createElement('div');
        iconContainer.className = 'icon-container';

        if (profile.linktree_url) {
          const iconMatch = getIcon(profile.linktree_url);
          const linkA = document.createElement('a');
          linkA.href = profile.linktree_url;
          linkA.target = '_blank';
          linkA.rel = 'noopener noreferrer';
          linkA.innerHTML = iconMatch || profile.linktree_url;
          iconContainer.appendChild(linkA);
        }

        uniqueLinks.forEach(link => {
          const iconMatch = getIcon(link);
          if (iconMatch) {
            const linkA = document.createElement('a');
            linkA.href = link;
            linkA.target = '_blank';
            linkA.rel = 'noopener noreferrer';
            linkA.innerHTML = iconMatch;
            iconContainer.appendChild(linkA);
          }
        });

        card.appendChild(titleLink);
        card.appendChild(img);
        card.appendChild(iconContainer);
        cardsContainer.appendChild(card);
      });
    }

    function updateFilter() {
      const filterSelect = document.getElementById('filterSelect');
      const filterType = filterSelect.value;
      const newData = filterAndSortData(allProfiles, filterType);
      renderCards(newData);
    }
  </script>
</body>
</html>
